name: Sync to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install huggingface_hub
        # Pinned to a known-good version. pip install -U "huggingface_hub[hf_xet]"
        # picked up a release whose auto-LFS behavior for .bin files diverged
        # from how our repo tracked them, and the Docker build's COPY ended
        # up baking LFS pointer text into the image -- torch.load then failed
        # with "invalid load key, 'v'" on every model load on the Space. Even
        # though we've since explicitly LFS-tracked the production model
        # weights (.gitattributes), pinning the SDK protects us from another
        # silent behavior change. Bump deliberately after testing.
        run: pip install "huggingface_hub[hf_xet]==0.36.0"

      - name: Upload to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python << 'PYEOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_folder(
              folder_path=".",
              repo_id=os.environ["HF_SPACE_ID"],
              repo_type="space",
              token=os.environ["HF_TOKEN"],
          )
          print("Upload complete")
          PYEOF
