; XIAO ESP32-S3 Sense — WiFi MJPEG camera for SignBridge external-camera mode.
;
; Board: Seeed XIAO ESP32-S3 Sense (ESP32-S3R8 + 8MB OPI PSRAM + OV2640 + SD slot)
; Camera: OV2640 via the Sense expansion board's onboard FPC connector
; Stream: HTTP server on port 81, MJPEG at /stream (matches SignBridge default)
; Serial: native USB-CDC (no external USB-serial chip)

[env:seeed_xiao_esp32s3]
platform        = espressif32
board           = seeed_xiao_esp32s3
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; PSRAM is 8 MB OPI (octal); must tell the Arduino core or PSRAM stays disabled
; and camera frame allocation fails at runtime.
board_build.arduino.memory_type = qio_opi

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; route Arduino Serial to the native USB CDC interface
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1          ; keep Serial chatter modest (warn+errors)
